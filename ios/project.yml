# StreamBox for iPhone + iPad - XcodeGen project definition.
#
# This file IS the Xcode project source of truth (the .xcodeproj is
# generated, never hand-edited):
#
#   brew install xcodegen
#   xcodegen generate          (or: make project)
#   open StreamBox.xcodeproj
#
# The project is deliberately dependency-free: Swift + SwiftUI + WKWebView +
# AVKit only. No CocoaPods, no SPM packages, no Capacitor.
name: StreamBox
options:
  bundleIdPrefix: com.streambox
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.36"
    CURRENT_PROJECT_VERSION: "242"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_ENABLE_MODULES: "YES"
    # Intentionally empty: a signing team is configured per-machine or via
    # CI secrets. Builds must work on a free Apple ID (personal team).
    DEVELOPMENT_TEAM: ""
configs:
  Debug: debug
  Release: release
targets:
  StreamBox:
    type: application
    platform: iOS
    sources:
      - path: StreamBox
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streambox.ios
        PRODUCT_NAME: StreamBox
        INFOPLIST_FILE: StreamBox/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "242"
  StreamBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreamBoxTests
    dependencies:
      - target: StreamBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streambox.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
  StreamBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StreamBoxUITests
    settings:
      base:
        TEST_TARGET_NAME: StreamBox
        PRODUCT_BUNDLE_IDENTIFIER: com.streambox.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  StreamBox:
    build:
      targets:
        StreamBox: all
        StreamBoxTests: [test]
        StreamBoxUITests: [test]
    test:
      config: Debug
      targets:
        - StreamBoxTests
        - StreamBoxUITests
    archive:
      config: Release
