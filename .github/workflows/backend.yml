name: StreamBox backend (native track)

on:
  push:
    branches: [native]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # both jobs only read the repo - no write scope for GITHUB_TOKEN
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check worker
        run: node --check backend/src/index.js

      - name: Syntax check party hub
        run: node --check backend/src/party.js

      - name: Site QA gate (branch carries the site too)
        run: node tools/qa.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # serialize deploys: two quick pushes used to be able to finish out of
    # order and silently roll the worker back to the OLDER commit
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy worker (skips cleanly until the secret exists)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not configured yet - deploy skipped."
            echo "Add it under repo Settings > Secrets > Variables > Actions to enable."
            echo "::warning::worker not deployed (CLOUDFLARE_API_TOKEN missing)"
            exit 0
          fi
          npx wrangler@3 deploy
