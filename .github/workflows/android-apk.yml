name: Build StreamBox APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --project-dir android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streambox-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk streambox.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest --prerelease \
            --title "StreamBox latest APK" \
            --notes "Auto-built from main (${{ github.sha }}). Uninstall the old app on your TV first, then install this file." \
            streambox.apk
