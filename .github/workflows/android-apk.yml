name: Build StreamBox APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run StreamBox QA gate (syntax + invariants)
        run: node tools/qa.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APKs (full + lite flavors)
        run: gradle :app:assembleDebug --project-dir android --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: streambox-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/full/debug/app-full-debug.apk streambox.apk
          cp android/app/build/outputs/apk/lite/debug/app-lite-debug.apk streambox-lite.apk
          # create-or-update: NEVER delete first (a flake between delete and
          # create used to leave the rolling release missing entirely). Assets
          # replace in place with --clobber; the tag survives every publish.
          for i in 1 2 3 4 5; do
            if gh release view latest >/dev/null 2>&1; then
              gh release edit latest \
                --title "StreamBox latest APKs" \
                --notes "Auto-built from main (${{ github.sha }}). Two flavors, install one or both side-by-side: streambox.apk = full motion, streambox-lite.apk = calm (max smoothness + battery). Uninstall the old app on your TV first, then install." && \
              gh release upload latest streambox.apk streambox-lite.apk --clobber && break
            else
              gh release create latest --prerelease \
                --title "StreamBox latest APKs" \
                --notes "Auto-built from main (${{ github.sha }}). Two flavors, install one or both side-by-side: streambox.apk = full motion, streambox-lite.apk = calm (max smoothness + battery). Uninstall the old app on your TV first, then install." \
                streambox.apk streambox-lite.apk && break
            fi
            echo "release publish attempt $i failed, retrying..."
            sleep 10
          done
          gh release view latest --json tagName,publishedAt,url
