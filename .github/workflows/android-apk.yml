name: Build StreamBox APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # serialize publishes: parallel runs racing the same rolling release can
    # interleave edit/upload and leave mixed-asset releases
    concurrency:
      group: rolling-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run StreamBox QA gate (syntax + invariants)
        run: node tools/qa.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APKs (full + lite flavors)
        run: gradle :app:assembleDebug --project-dir android --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: streambox-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/full/debug/app-full-debug.apk streambox.apk
          cp android/app/build/outputs/apk/lite/debug/app-lite-debug.apk streambox-lite.apk
          VN=$(sed -n "s/.*versionName '\([0-9.]*\)'.*/\1/p" android/app/build.gradle | head -n1)
          SHA1=$(sha256sum streambox.apk | cut -d' ' -f1)
          SHA2=$(sha256sum streambox-lite.apk | cut -d' ' -f1)
          NOTES="$(cat release-notes/android.md)

          Auto-built from main (${{ github.sha }}).
          sha256 streambox.apk: $SHA1
          sha256 streambox-lite.apk: $SHA2"
          # create-or-update: NEVER delete first (a flake between delete and
          # create used to leave the rolling release missing entirely). Assets
          # replace in place with --clobber; the tag survives every publish.
          published=0
          for i in 1 2 3 4 5; do
            if gh release view latest >/dev/null 2>&1; then
              if gh release edit latest --title "StreamBox latest APKs" --notes "$NOTES" && \
                 gh release upload latest streambox.apk streambox-lite.apk --clobber; then
                published=1; break
              fi
            else
              if gh release create latest --prerelease --target "${{ github.sha }}" \
                 --title "StreamBox latest APKs" --notes "$NOTES" \
                 streambox.apk streambox-lite.apk; then
                published=1; break
              fi
            fi
            echo "release publish attempt $i failed, retrying..."
            sleep 10
          done
          # a green job must MEAN the new APKs are live: notes claiming this
          # sha over stale assets is a lying release - fail loudly instead.
          if [ "$published" != "1" ]; then
            echo "release publish failed after 5 attempts" >&2
            exit 1
          fi
          # versioned rollback release: one permanent tag per version so any
          # older build stays downloadable (created once per versionName)
          if [ -z "$VN" ]; then
            echo "::error::no versionName parsed from android/app/build.gradle"
            exit 1
          fi
          TAG="apk-v$VN"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "rollback release $TAG already exists - keeping it untouched"
          else
            gh release create "$TAG" --target "${{ github.sha }}" \
              --title "StreamBox $VN (full + lite)" \
              --notes "$NOTES" \
              streambox.apk streambox-lite.apk
          fi
          gh release view latest --json tagName,publishedAt,url
