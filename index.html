<script>
/* Popup-ads safety net for our own page (iframe popups are blocked by sandbox above) */
(function(){
  try {
    const _open = window.open;
    window.open = function(url, ...rest){
      // allow only player-origin navigations triggered by user on our buttons; block the rest
      if (typeof url === "string" && /cinesrc\.st|themoviedb\.org|image\.tmdb\.org/i.test(url)) return _open.call(window, url, ...rest);
      return null;
    };
    document.addEventListener("click", e => {
      const a = e.target.closest && e.target.closest('a[target="_blank"]');
      if (a && !/cinesrc\.st|themoviedb/i.test(a.href)) { e.preventDefault(); }
    }, true);
  } catch(e){}
})();
function preconnectCinesrc(){
  try {
    if (!document.querySelector('link[href="https://cinesrc.st"][rel="preconnect"]')) {
      const l = document.createElement("link");
      l.rel = "preconnect"; l.href = "https://cinesrc.st"; l.crossOrigin = "";
      document.head.appendChild(l);
    }
  } catch(e){}
}
let currentType = "all", currentItem = null, currentDetail = null;
let watchState = { type:"movie", id:null, s:1, e:1 };
let searchTimer = null, searchCtrl = null;

/* ---------- TMDB helpers (cached: memory + sessionStorage, 10-min TTL) ---------- */
const _mem = new Map();
function tmdb(path){
  const sep = path.includes("?") ? "&" : "?";
  const url = `${TMDB_BASE}${path}${sep}api_key=${TMDB_API_KEY}&language=en-US`;
  const now = Date.now(), TTL = 10 * 60 * 1000;
  const hit = _mem.get(url);
  if (hit && now - hit.t < TTL) return Promise.resolve(hit.d);
  try {
    const raw = sessionStorage.getItem("sb:" + url);
    if (raw) { const c = JSON.parse(raw); if (now - c.t < TTL) { _mem.set(url, c); return Promise.resolve(c.d); } }
  } catch(e){}
  return fetch(url).then(r => r.json()).then(d => {
    const c = { t: now, d };
    _mem.set(url, c);
    try { sessionStorage.setItem("sb:" + url, JSON.stringify(c)); } catch(e){}
    return d;
  });
}
const titleOf = x => x.title || x.name || "Untitled";
const yearOf = x => (x.release_date || x.first_air_date || "").slice(0,4);

/* ---------- HOME ---------- */
async function init(){
  renderContinue();
  const [trend, popM, popT, topM, topT] = await Promise.all([
    tmdb("/trending/all/week"),
    tmdb("/movie/popular"),
    tmdb("/tv/popular"),
    tmdb("/movie/top_rated"),
    tmdb("/tv/top_rated")
  ]);
  buildHero(trend.results.slice(0,5));
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  rows.appendChild(makeRow("Trending Now", trend.results));
  rows.appendChild(makeRow("Popular Movies", popM.results, "movie"));
  rows.appendChild(makeRow("Popular TV Shows", popT.results, "tv"));
  rows.appendChild(makeRow("Top Rated Movies", topM.results, "movie"));
  rows.appendChild(makeRow("Top Rated TV", topT.results, "tv"));
  // TV: start with focus on content so the remote works immediately
  if (document.body.classList.contains("tv-mode")) {
    setTimeout(() => {
      const first = document.querySelector("#hero button") || document.querySelector("#rows .card");
      if (first) first.focus();
    }, 400);
  }
}

function makeRow(title, items, forceType){
  const div = document.createElement("div");
  div.innerHTML = `<h2 class="text-lg font-bold mb-2">${title}</h2>`;
  const sc = document.createElement("div");
  sc.className = "flex gap-3 overflow-x-auto row-scroll pb-2";
  items.filter(x=>x.poster_path).forEach(x=>{
    const type = forceType || (x.media_type === "tv" ? "tv" : "movie");
    sc.appendChild(cardEl(x, type));
  });
  div.appendChild(sc);
  return div;
}

function cardEl(x, type){
  const d = document.createElement("div");
  d.className = "card min-w-[130px] md:min-w-[160px] max-w-[130px] md:max-w-[160px] focusable";
  d.tabIndex = 0;
  d.setAttribute("role", "button");
  d.setAttribute("aria-label", `${titleOf(x)} (${type})`);
  d.setAttribute("data-focusable", "1");
  d.innerHTML = `
    <img loading="lazy" decoding="async" src="${IMG(x.poster_path,"w342")}" class="rounded-lg w-full aspect-[2/3] object-cover bg-white/5">
    <p class="text-xs mt-1.5 font-semibold truncate">${titleOf(x)}</p>
    <p class="text-[11px] text-gray-500">★ ${Number(x.vote_average||0).toFixed(1)} • ${yearOf(x)} • ${type.toUpperCase()}</p>`;
  d.onclick = () => openDetail(type, x.id);
  d.onmouseenter = preconnectCinesrc;
  d.onfocus = preconnectCinesrc;
  d.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openDetail(type, x.id); } };
  return d;
}

/* ---------- Devices: PWA + Android TV / tablets / iOS ---------- */
(function setupDevices(){
  // TV detection: Android TV, Fire TV, Tizen, WebOS, Smart TV UAs
  const ua = navigator.userAgent || "";
  const isTV = /Android TV|Smart TV|SmartTV|Tizen|WebOS|TV;|GoogleTV|BRAVIA|Fire TV|AFT/i.test(ua) || new URLSearchParams(location.search).has("tv");
  if (isTV) document.body.classList.add("tv-mode");
  // mark static buttons focusable for D-pad
  document.querySelectorAll("button, select, input, a").forEach(el => el.setAttribute("data-focusable", "1"));
  // install prompt (Android Chrome): show Install button when available
  let deferred = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); deferred = e;
    try {
      if (document.getElementById("installBtn")) return;
      const b = document.createElement("button");
      b.id = "installBtn";
      b.textContent = "⤓ Install";
      b.className = "text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full";
      b.setAttribute("data-focusable", "1");
      b.onclick = async () => { if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; b.remove(); } };
      document.querySelector("nav").appendChild(b);
    } catch(err){}
  });
  // service worker (offline shell + repeat-visit speed; skipped on file:// )
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
  // D-pad / arrow-key spatial navigation (Android TV remotes, keyboards)
  document.addEventListener("keydown", (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (/INPUT|SELECT|TEXTAREA/.test(tag)) {
      if (e.key === "Escape") { document.activeElement.blur(); return; }
      // TV: arrows leave the search box into results instead of being trapped
      if ((e.key === "ArrowDown" || e.key === "ArrowUp") && document.activeElement.id === "search") {
        const first = document.querySelector("#grid .card, #rows .card");
        if (first) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) {
      // Focus trap: when the details popup is open, the remote stays inside it
      const modalOpen = !document.getElementById("modal").classList.contains("hidden");
      const scope = modalOpen ? document.getElementById("modal") : document;
      const items = [...scope.querySelectorAll('[data-focusable="1"], button, select, input, a, [tabindex="0"]')]
        .filter(el => el.offsetParent !== null && !el.disabled);
      if (!items.length) return;
      const cur = document.activeElement;
      if (!cur || !items.includes(cur)) { items[0].focus(); e.preventDefault(); return; }
      const r1 = cur.getBoundingClientRect();
      const cx = r1.left + r1.width / 2, cy = r1.top + r1.height / 2;
      let best = null, bestScore = Infinity;
      for (const el of items) {
        if (el === cur) continue;
        const r = el.getBoundingClientRect();
        const ex = r.left + r.width / 2, ey = r.top + r.height / 2;
        const dx = ex - cx, dy = ey - cy;
        let ok = false, primary = 0, secondary = 0;
        if (e.key === "ArrowRight" && dx > 10) { ok = true; primary = dx; secondary = Math.abs(dy); }
        if (e.key === "ArrowLeft" && dx < -10) { ok = true; primary = -dx; secondary = Math.abs(dy); }
        if (e.key === "ArrowDown" && dy > 10) { ok = true; primary = dy; secondary = Math.abs(dx); }
        if (e.key === "ArrowUp" && dy < -10) { ok = true; primary = -dy; secondary = Math.abs(dx); }
        if (!ok) continue;
        const score = primary + secondary * 2.5;
        if (score < bestScore) { bestScore = score; best = el; }
      }
      if (best) {
        e.preventDefault();
        best.focus({ preventScroll: false });
        const instant = document.body.classList.contains("tv-mode");
        best.scrollIntoView({ block: "nearest", inline: "nearest", behavior: instant ? "auto" : "smooth" });
        // keep horizontal rows glued to the focused card (Netflix-style)
        const row = best.closest && best.closest(".row-scroll");
        if (row) {
          const rr = row.getBoundingClientRect(), br = best.getBoundingClientRect();
          if (br.left < rr.left + 16) row.scrollBy({ left: br.left - rr.left - 32, behavior: instant ? "auto" : "smooth" });
          else if (br.right > rr.right - 16) row.scrollBy({ left: br.right - rr.right + 32, behavior: instant ? "auto" : "smooth" });
        }
        document.querySelectorAll(".tv-focus").forEach(x => x.classList.remove("tv-focus"));
        best.classList.add("tv-focus");
      } else if (modalOpen && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
        // bottom/top of popup reached: scroll its content instead of doing nothing
        e.preventDefault();
        const panel = document.querySelector("#modal > div");
        if (panel) panel.scrollBy({ top: e.key === "ArrowDown" ? 240 : -240, behavior: "auto" });
      }
    }
    // TV Back / Esc: close modal first, else go home
    if (e.key === "Escape" || e.key === "Backspace" || e.keyCode === 461 || e.keyCode === 10009) {
      const modal = document.getElementById("modal");
      if (modal && !modal.classList.contains("hidden")) { closeModal(); e.preventDefault(); return; }
      const watch = document.getElementById("watchView");
      if (watch && !watch.classList.contains("hidden")) { goHome(e); e.preventDefault(); }
    }
  }, true);
  document.addEventListener("focusin", (e) => {
    document.querySelectorAll(".tv-focus").forEach(x => x.classList.remove("tv-focus"));
    if (e.target && e.target.classList) e.target.classList.add("tv-focus");
  });
})();

let heroIdx = 0, heroItems = [];
function buildHero(items){
  heroItems = items;
  setHero(0);
  setInterval(()=>{
    if(!document.getElementById("homeView").classList.contains("hidden"))
      setHero((heroIdx+1)%heroItems.length);
  }, document.body.classList.contains("tv-mode") ? 15000 : 8000);
}
function setHero(i){
  heroIdx = i;
  const x = heroItems[i]; if(!x) return;
  const type = x.media_type === "tv" ? "tv" : "movie";
  document.getElementById("hero").innerHTML = `
    <img src="${IMG(x.backdrop_path,"w1280")}" fetchpriority="high" decoding="async" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 hero-gradient"></div>
    <div class="relative px-4 md:px-10 pb-16 max-w-2xl">
      <span class="text-xs bg-red-600 px-3 py-1 rounded-full font-bold">#${i+1} TRENDING • ${type.toUpperCase()}</span>
      <h1 class="text-3xl md:text-5xl font-black mt-3">${titleOf(x)}</h1>
      <p class="text-sm text-gray-300 mt-2 line-clamp-3">${x.overview||""}</p>
      <div class="flex gap-3 mt-4">
        <button onmouseenter="preconnectCinesrc()" onclick='openDetail("${type}",${x.id})' class="bg-red-600 hover:bg-red-500 font-bold px-6 py-2.5 rounded-full">▶ Watch</button>
        <button onclick='openDetail("${type}",${x.id})' class="bg-white/20 hover:bg-white/30 px-6 py-2.5 rounded-full">Details</button>
      </div>
    </div>`;
  // preload next hero backdrop so rotation is instant
  try {
    const nxt = heroItems[(i+1)%heroItems.length];
    if (nxt && nxt.backdrop_path) { const im = new Image(); im.decoding = "async"; im.src = IMG(nxt.backdrop_path, "w1280"); }
  } catch(e){}
}

/* ---------- SEARCH / FILTER ---------- */
function onSearch(q){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async ()=>{
    q = q.trim();
    if(!q){ showRows(); return; }
    try { if (searchCtrl) searchCtrl.abort(); } catch(e){}
    searchCtrl = new AbortController();
    try {
      const sep = "/search/multi?".includes("?") ? "&" : "?";
      const url = `${TMDB_BASE}/search/multi?query=${encodeURIComponent(q)}&include_adult=false&api_key=${TMDB_API_KEY}&language=en-US`;
      const r = await fetch(url, { signal: searchCtrl.signal });
      const data = await r.json();
      showGrid(`Results for "${q}"`, (data.results||[]).filter(x=>(x.media_type==="movie"||x.media_type==="tv") && x.poster_path));
    } catch(e){ /* aborted or offline — ignore */ }
  }, 400);
}
function showGrid(title, items){
  document.getElementById("rows").classList.add("hidden");
  document.getElementById("hero").classList.add("hidden");
  document.getElementById("continueRow").classList.add("hidden");
  const gv = document.getElementById("gridView");
  gv.classList.remove("hidden");
  document.getElementById("gridTitle").textContent = title;
  const g = document.getElementById("grid"); g.innerHTML = "";
  items.forEach(x=>{
    const type = x.media_type === "tv" ? "tv" : "movie";
    g.appendChild(cardEl(x, type));
  });
  if(!items.length) g.innerHTML = "<p class='text-gray-500'>No results found.</p>";
}
function showRows(){
  document.getElementById("gridView").classList.add("hidden");
  document.getElementById("rows").classList.remove("hidden");
  document.getElementById("hero").classList.remove("hidden");
  renderContinue();
}
async function filterType(type, ev){
  if(ev) ev.preventDefault();
  document.getElementById("search").value = "";
  const r = await tmdb(type==="movie" ? "/movie/popular" : "/tv/popular");
  showGrid(type==="movie" ? "Popular Movies" : "Popular TV Shows", r.results.map(x=>({...x, media_type:type})));
}
function showContinue(ev){ if(ev) ev.preventDefault(); goHome(ev); document.getElementById("continueRow").scrollIntoView({behavior:"smooth"}); }

/* ---------- DETAIL MODAL ---------- */
let modalSeasons = [], modalSeasonIdx = 0, modalEpisodes = [], modalEpIdx = 0, lastOpener = null;
async function openDetail(type, id){
  lastOpener = document.activeElement;
  const d = await tmdb(`/${type}/${id}?append_to_response=credits`);
  currentDetail = { type, id, data: d };
  document.getElementById("mBackdrop").src = IMG(d.backdrop_path, "w780");
  document.getElementById("mBackdrop").loading = "eager";
  document.getElementById("mTitle").textContent = titleOf(d);
  document.getElementById("mMeta").textContent = `★ ${Number(d.vote_average||0).toFixed(1)} • ${(d.release_date||d.first_air_date||"").slice(0,4)} • ${(d.genres||[]).map(g=>g.name).join(", ")}`;
  document.getElementById("mOverview").textContent = d.overview || "No overview.";
  document.getElementById("mWatch").onclick = () => {
    if(type==="tv"){
      const s = (modalSeasons[modalSeasonIdx]||{}).season_number || 1;
      const e = (modalEpisodes[modalEpIdx]||{}).episode_number || 1;
      closeModal(); openWatch(type, id, s, e);
    } else { closeModal(); openWatch(type, id); }
  };
  const sWrap = document.getElementById("mSeasons");
  if(type==="tv"){
    sWrap.classList.remove("hidden");
    modalSeasons = (d.seasons||[]).filter(s=>s.season_number>0);
    modalSeasonIdx = 0;
    updateModalSeasonLabel();
    await loadModalEpisodes();
  } else sWrap.classList.add("hidden");
  document.getElementById("modal").classList.remove("hidden");
  document.body.classList.add("modal-open");
  // Netflix-style: land focus on the primary action so remotes work instantly
  setTimeout(()=>{ const w = document.getElementById("mWatch"); if (w) w.focus(); }, 60);
}
function updateModalSeasonLabel(){
  const s = modalSeasons[modalSeasonIdx] || { season_number: 1, episode_count: "?" };
  document.getElementById("mSeasonLabel").textContent = `S${s.season_number} (${s.episode_count} eps)`;
}
function updateModalEpLabel(){
  const e = modalEpisodes[modalEpIdx];
  document.getElementById("mEpisodeLabel").textContent = e ? `E${e.episode_number} — ${(e.name||"").slice(0,18)}` : "E1";
}
async function loadModalEpisodes(){
  const s = (modalSeasons[modalSeasonIdx]||{}).season_number || 1;
  const d = await tmdb(`/tv/${currentDetail.id}/season/${s}`);
  modalEpisodes = d.episodes || [];
  modalEpIdx = 0;
  updateModalEpLabel();
}
function modalSeasonStep(dir){
  if (!modalSeasons.length) return;
  modalSeasonIdx = (modalSeasonIdx + dir + modalSeasons.length) % modalSeasons.length;
  updateModalSeasonLabel();
  loadModalEpisodes();
}
function modalEpStep(dir){
  if (!modalEpisodes.length) return;
  modalEpIdx = (modalEpIdx + dir + modalEpisodes.length) % modalEpisodes.length;
  updateModalEpLabel();
}
function closeModal(){
  document.getElementById("modal").classList.add("hidden");
  document.body.classList.remove("modal-open");
  if (lastOpener && lastOpener.focus) { try { lastOpener.focus({ preventScroll: true }); } catch(e){} }
}

/* ---------- WATCH ---------- */
async function openWatch(type, id, s=1, e=1){
  watchState = { type, id, s, e };
  document.getElementById("homeView").classList.add("hidden");
  document.getElementById("watchView").classList.remove("hidden");
  window.scrollTo(0,0);
  const d = await tmdb(`/${type}/${id}?append_to_response=credits`);
  currentItem = d;
  document.getElementById("wPoster").src = IMG(d.poster_path, "w342");
  document.getElementById("wPoster").loading = "eager";
  document.getElementById("wTitle").textContent = titleOf(d);
  document.getElementById("wMeta").textContent = `${type.toUpperCase()} • ${(d.release_date||d.first_air_date||"").slice(0,4)} • ${(d.genres||[]).map(g=>g.name).join(", ")}`;
  document.getElementById("wRating").textContent = `★ ${Number(d.vote_average||0).toFixed(1)} (${d.vote_count||0} votes)`;
  document.getElementById("wOverview").textContent = d.overview || "";
  document.getElementById("wCast").textContent = "Cast: " + ((d.credits&&d.credits.cast||[]).slice(0,6).map(c=>c.name).join(", ") || "");
  // TV episode UI
  if(type==="tv"){
    document.getElementById("epNav").classList.remove("hidden");
    watchSeasons = (d.seasons||[]).filter(x=>x.season_number>0);
    updateSeasonLabel();
    await loadEpisodes();
  } else document.getElementById("epNav").classList.add("hidden");
  loadPlayer();
  saveContinue();
}
async function loadEpisodes(){
  const { id, s, e } = watchState;
  const d = await tmdb(`/tv/${id}/season/${s}`);
  const grid = document.getElementById("epGrid"); grid.innerHTML = "";
    (d.episodes||[]).forEach(ep=>{
    const b = document.createElement("button");
    b.textContent = "E" + ep.episode_number;
    b.title = ep.name;
    b.setAttribute("data-focusable", "1");
    b.className = "text-xs px-2 py-2 rounded-lg " + (ep.episode_number==e ? "bg-red-600 font-bold" : "bg-white/10 hover:bg-white/20");
    b.onclick = ()=>{ watchState.e = ep.episode_number; loadPlayer(); loadEpisodes(); saveContinue(); };
    grid.appendChild(b);
  });
}
let watchSeasons = [];
function updateSeasonLabel(){
  document.getElementById("seasonLabel").textContent = `Season ${watchState.s}`;
}
function watchSeasonStep(dir){
  if (!watchSeasons.length) return;
  const nums = watchSeasons.map(x=>x.season_number).sort((a,b)=>a-b);
  let i = nums.indexOf(watchState.s);
  if (i < 0) i = 0;
  watchState.s = nums[(i + dir + nums.length) % nums.length];
  watchState.e = 1;
  updateSeasonLabel(); loadEpisodes(); loadPlayer(); saveContinue();
}
function nextEpisode(dir){
  watchState.e += dir;
  if(watchState.e < 1) watchState.e = 1;
  loadPlayer(); loadEpisodes(); saveContinue();
}

/* Embed URL per https://cinesrc.st/docs */
function buildEmbedUrlClean(){
  const color = encodeURIComponent(document.getElementById("optColor").value||"#e50914");
  const p = `autoplay=${document.getElementById("optAutoplay").checked}&autonext=${document.getElementById("optAutonext").checked}&autoskip=${document.getElementById("optAutoskip").checked}&color=${color}`;
  if(watchState.type==="movie") return `https://cinesrc.st/embed/movie/${watchState.id}?${p}`;
  return `https://cinesrc.st/embed/tv/${watchState.id}?s=${watchState.s}&e=${watchState.e}&${p}`;
}
function loadPlayer(){
  preconnectCinesrc();
  const spin = document.getElementById("playerSpin");
  if (spin) spin.style.display = "grid";
  const f = document.getElementById("player");
  // cache-bust only when re-loading same URL so back-to-back episode clicks always refresh
  f.src = buildEmbedUrlClean() + (buildEmbedUrlClean().includes("?") ? "&" : "?") + "_=" + Date.now();
  const { type, s, e } = watchState;
  document.getElementById("watchStatus").textContent = type==="tv" ? `Now playing S${s} E${e}` : "Now playing";
  // fallback: hide spinner after 12s even if player never fires ready (ad-blocked network etc.)
  clearTimeout(window._spinT);
  window._spinT = setTimeout(()=>{ if (spin) spin.style.display = "none"; }, 12000);
}
function reloadPlayer(){ loadPlayer(); }
function toggleShield(){
  const on = document.getElementById("optShield").checked;
  const f = document.getElementById("player");
  // Shield ON = sandbox without popups/top-navigation. OFF = allow popups (only if a server breaks).
  f.setAttribute("sandbox", on ? "allow-scripts allow-same-origin allow-forms allow-presentation" : "allow-scripts allow-same-origin allow-forms allow-presentation allow-popups allow-modals");
  loadPlayer();
}
function applyPlayerOpts(){ loadPlayer(); }

function goHome(ev){
  if(ev) ev.preventDefault();
  if (!document.getElementById("modal").classList.contains("hidden")) closeModal();
  document.getElementById("watchView").classList.add("hidden");
  document.getElementById("homeView").classList.remove("hidden");
  document.getElementById("player").src = "";
  showRows();
}

/* ---------- Continue watching + My List (localStorage) ---------- */
// one-time migration from old CineStream key
try {
  if (!localStorage.getItem("streambox_continue") && localStorage.getItem("cine_continue")) {
    localStorage.setItem("streambox_continue", localStorage.getItem("cine_continue"));
  }
} catch(e){}
function saveContinue(){
  try{
    const k = "streambox_continue";
    let arr = JSON.parse(localStorage.getItem(k)||"[]");
    const item = { type: watchState.type, id: watchState.id, s: watchState.s, e: watchState.e,
      title: titleOf(currentItem||{}), poster: (currentItem||{}).poster_path, t: Date.now() };
    arr = [item, ...arr.filter(x=>!(x.type===item.type&&x.id===item.id))].slice(0,20);
    localStorage.setItem(k, JSON.stringify(arr));
    renderContinue();
  }catch(e){}
}
function renderContinue(){
  try{
    const arr = JSON.parse(localStorage.getItem("streambox_continue")||"[]");
    const row = document.getElementById("continueRow"), grid = document.getElementById("continueGrid");
    if(!arr.length){ row.classList.add("hidden"); return; }
    row.classList.remove("hidden"); grid.innerHTML = "";
    arr.forEach(x=>{
      const d = document.createElement("div");
      d.className = "card min-w-[130px] max-w-[130px] relative focusable";
      d.tabIndex = 0;
      d.setAttribute("role", "button");
      d.setAttribute("data-focusable", "1");
      d.setAttribute("aria-label", `${x.title||""} (${x.type})`);
      d.innerHTML = `<img loading="lazy" decoding="async" src="${IMG(x.poster,"w342")}" class="rounded-lg w-full aspect-[2/3] object-cover"><p class="text-xs mt-1 truncate">${x.title||""}</p><p class="text-[11px] text-gray-500">${x.type.toUpperCase()}${x.type==="tv"?` S${x.s} E${x.e}`:""}</p><button class="absolute top-1 right-1 bg-black/70 w-6 h-6 rounded-full text-xs" aria-label="Remove">✕</button>`;
      d.onclick = ()=>openWatch(x.type, x.id, x.s||1, x.e||1);
      d.onkeydown = (ev)=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); openWatch(x.type, x.id, x.s||1, x.e||1); } };
      d.querySelector("button").onclick = (ev)=>{ ev.stopPropagation(); removeContinue(x.type,x.id); };
      grid.appendChild(d);
    });
  }catch(e){}
}
function removeContinue(type,id){
  let arr = JSON.parse(localStorage.getItem("streambox_continue")||"[]");
  arr = arr.filter(x=>!(x.type===type&&x.id===id));
  localStorage.setItem("streambox_continue", JSON.stringify(arr));
  renderContinue();
}
function addToList(){
  if(!currentDetail) return;
  let arr = JSON.parse(localStorage.getItem("streambox_continue")||"[]");
  const d = currentDetail.data;
  const item = { type: currentDetail.type, id: currentDetail.id, s:1, e:1, title: titleOf(d), poster: d.poster_path, t: Date.now() };
  arr = [item, ...arr.filter(x=>!(x.type===item.type&&x.id===item.id))].slice(0,20);
  localStorage.setItem("streambox_continue", JSON.stringify(arr));
  alert("Added to My List ✓");
}

/* ---------- CineSrc player events (per docs) ---------- */
function hideSpin(){ const s = document.getElementById("playerSpin"); if (s) s.style.display = "none"; }
document.getElementById("player").addEventListener("load", ()=>{ setTimeout(hideSpin, 800); });
window.addEventListener("message", (event)=>{
  if(event.origin !== "https://cinesrc.st") return;
  const { type, ...data } = event.data || {};
  if(type === "cinesrc:ready" || type === "cinesrc:play" || type === "cinesrc:loadedmetadata") hideSpin();
  if(type === "cinesrc:nextepisode" && data.internalNavigation){
    // player advanced internally — sync our UI, do NOT reload iframe
    if(data.season) watchState.s = data.season;
    if(data.episode) watchState.e = data.episode;
    loadEpisodes(); saveContinue();
    document.getElementById("watchStatus").textContent = `Now playing S${watchState.s} E${watchState.e}`;
  }
  if(type === "cinesrc:timeupdate"){
    // could save progress here: data.currentTime / data.duration
  }
  if(type === "cinesrc:error"){
    document.getElementById("watchStatus").textContent = "Stream error — try again or pick another episode.";
  }
});

// deep-link support: watch.html style ?type=tv&id=1396&s=1&e=1
(function(){
  const q = new URLSearchParams(location.search);
  if(q.get("id")){
    const t = q.get("type")==="tv" ? "tv" : "movie";
    openWatch(t, q.get("id"), Number(q.get("s")||1), Number(q.get("e")||1));
  } else init();
})();
</script>
