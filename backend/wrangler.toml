# StreamBox API - Cloudflare Worker (native track backend).
# No bindings: everything is stateless + Workers Cache API, so `wrangler
# deploy` is the only provisioning step. Secrets (set once per account):
#   npx wrangler@3 secret put TMDB_API_KEY
name = "streambox-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[observability]
enabled = true

# Watch Party: room hub Durable Object (free-plan SQLite backend). The
# /party WebSocket route lands here; see src/party.js.
[[durable_objects.bindings]]
name = "PARTY_HUB"
class_name = "PartyHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyHub"]
