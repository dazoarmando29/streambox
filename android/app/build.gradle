plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streambox.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.streambox.app'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
