plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streambox.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.streambox.app'
        minSdk 24
        targetSdk 34
        versionCode 27
        versionName '2.25'
    }

    buildFeatures {
        buildConfig true
    }
    flavorDimensions "edition"
    productFlavors {
        // Full motion site (startUrl() re-derives ?tv=1 per DEVICE: TV boxes
        // get the remote layout, phones the touch UI - the flavor URL param
        // is only the calm default)
        full {
            dimension "edition"
            applicationId "com.streambox.app"
            buildConfigField "String", "HOME_URL", "\"https://dazoarmando29.github.io/streambox/?tv=1\""
        }
        // Calm site (?calm=1 kills motion/blur/glow + smaller posters; same pixels, max smoothness)
        lite {
            dimension "edition"
            applicationId "com.streambox.lite"
            buildConfigField "String", "HOME_URL", "\"https://dazoarmando29.github.io/streambox/?tv=1&calm=1\""
        }
    }

    // Every build (local + CI) signs with the SAME committed preview key so
    // an APK always installs OVER the previous one. The runner-minted debug
    // key re-signed every build and "update" failed with an install error.
    // Sideload preview key, intentionally public - not a production secret.
    signingConfigs {
        preview {
            storeFile file("../preview.keystore")
            storePassword "streambox"
            keyAlias "streambox"
            keyPassword "streambox"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.preview
        }
        debug {
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.preview
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
